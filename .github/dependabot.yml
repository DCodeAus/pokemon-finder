# Dependabot checks npm every week and opens a pull request when a package
# has a newer version. Small (minor/patch) updates come together in one pull
# request to keep the noise down; a major version gets its own, since those
# can need code changes. Nothing changes until a pull request is merged.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Hold these at their current major version. The Next.js lint plugins
    # don't support ESLint 10 or TypeScript 7 yet, and @types/node should
    # match the Node.js version the app runs on (24, as Vercel uses) rather
    # than the newest one. Only major-version upgrades are held back -
    # minor and patch updates (where security fixes usually land) still
    # come through. Remove a line once Next.js supports the newer version.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
